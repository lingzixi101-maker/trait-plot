<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trait Plot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ea; --ink:#1f1d1a; --muted:#6f6a61; --line:#d9d2c4; --card:#fffdf8;
    --good:#2f8f63; --goodBg:#e3f3ea; --bad:#d4483f; --badBg:#fbe6e3;
    --p1:#2f6fd6; --p2:#d98a12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0 0 20px}
  button{font:inherit;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  button.p1{background:var(--p1)} button.p2{background:var(--p2)}
  button.small{padding:6px 10px;font-size:13px}
  input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:160px}
  .panel{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .landing{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .landing h2{margin:0 0 6px;font-size:19px}
  .landing p{color:var(--muted);margin:0 0 14px;font-size:14px;line-height:1.45}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .score{display:flex;gap:10px}
  .chip{border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;border:2px solid transparent;background:#fff}
  .chip.p1{color:var(--p1);border-color:var(--p1)} .chip.p2{color:var(--p2);border-color:var(--p2)}
  .chip.me{box-shadow:0 0 0 3px rgba(0,0,0,.08)}
  .meta{color:var(--muted);font-size:14px}
  .game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  @media (max-width:760px){.game{grid-template-columns:1fr}}
  .plotBox{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:8px}
  svg#plot{width:100%;height:auto;display:block;touch-action:manipulation}
  svg#plot.clickable{cursor:crosshair}
  .side{display:grid;gap:14px}
  .piles{display:flex;gap:10px}
  .pile{flex:1;border-radius:14px;padding:12px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;border:2px solid}
  .pile.good{background:var(--goodBg);border-color:var(--good)} .pile.bad{background:var(--badBg);border-color:var(--bad)}
  .pile .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
  .pile.good .lbl{color:var(--good)} .pile.bad .lbl{color:var(--bad)}
  .pile .trait{font-size:21px;font-weight:700;line-height:1.15}
  .pile .back{font-size:13px;color:var(--muted)}
  .status{font-size:15px;line-height:1.45}
  .status b{font-weight:700}
  .big{font-size:34px;font-weight:700;letter-spacing:-1px}
  .notice{background:#fff4d6;border:1.5px solid #ecd28b;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px}
  .cover{position:fixed;inset:0;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;text-align:center}
  .cover h2{font-size:30px;margin:0 0 10px}
  .cover p{color:#cfc9bf;margin:0 0 22px}
  .hist{font-size:13px;color:var(--muted);width:100%;border-collapse:collapse}
  .hist td{padding:4px 0;border-top:1px solid var(--line)}
  .hist td:last-child{text-align:right;font-weight:600;color:var(--ink)}
  .seat{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .seat:first-of-type{border-top:0}
  a.link{color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
const GOOD = ["Hardworking","Loyal","Kind","Honest","Funny","Patient","Generous","Curious","Brave","Organised","Optimistic","Humble","Reliable","Creative","Calm","Thoughtful","Ambitious","Confident","Empathetic","Adventurous","Disciplined","Supportive","Witty","Resourceful","Charming","Punctual","Open-minded","Diplomatic","Energetic","Forgiving"];
const BAD  = ["Lazy","Rude","Stubborn","Impatient","Messy","Arrogant","Forgetful","Jealous","Indecisive","Dramatic","Nosy","Moody","Selfish","Impulsive","Sarcastic","Clumsy","Petty","Gullible","Flaky","Competitive","Bossy","Anxious","Picky","Gossipy","Lazy texter","Overthinker","Loud","Procrastinator","Easily bored","Cheap"];
const TOTAL_ROUNDS = 6;

const app = document.getElementById('app');
let mode = null;          // 'online' | 'local'
let peer = null, conn = null, me1 = 0, room = '', connected = false;
let state = null, pending = null, cover = 0, notice = '', writeBlocked = false, loading = false;
const PREFIX = 'traitplot-v1-';
const newCode = () => Array.from({length:5}, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const other = n => n === 1 ? 2 : 1;
const cleanRoom = s => (s || '').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 30) || 'main';

function freshState(){
  return { v:1, p1:null, p2:null, round:1, total:TOTAL_ROUNDS, placer:1, phase:'lobby',
    good:null, bad:null, place:null, guess:null, scores:{"1":0,"2":0}, last:null,
    used:{good:[],bad:[]}, history:[] };
}

/* ---------- roles ---------- */
function myRole(){
  if (!state) return 0;
  if (mode === 'local') {
    if (state.phase === 'draw' || state.phase === 'place') return state.placer;
    if (state.phase === 'guess') return other(state.placer);
    return 0;
  }
  return me1;
}

/* ---------- writes ---------- */
function commit(next){
  state = next; pending = null; render();
  if (mode === 'local') return;
  send();
}
function send(){
  if (conn && conn.open) conn.send({ type:'state', state: clone(state) });
  else { notice = "Not connected to the other player — this move will sync when they reconnect."; render(); }
}

/* ---------- game actions ---------- */
function drawFrom(list, used){
  let pool = list.filter(t => !used.includes(t));
  if (!pool.length) { used.length = 0; pool = list.slice(); }
  const t = pool[Math.floor(Math.random() * pool.length)];
  used.push(t); return t;
}
function actDraw(){
  const s = clone(state);
  s.good = drawFrom(GOOD, s.used.good);
  s.bad = drawFrom(BAD, s.used.bad);
  s.phase = 'place';
  commit(s);
}
function actLock(){
  if (!pending) return;
  const s = clone(state);
  if (s.phase === 'place') {
    s.place = pending; s.phase = 'guess';
    if (mode === 'local') cover = other(s.placer);
  } else if (s.phase === 'guess') {
    s.guess = pending;
    const d = Math.hypot(s.place.x - s.guess.x, s.place.y - s.guess.y);
    const pts = Math.max(0, Math.round(100 - 15 * d));
    const g = other(s.placer);
    s.scores[g] = (s.scores[g] || 0) + pts;
    s.last = { dist: Math.round(d * 10) / 10, pts };
    s.history.push({ round: s.round, placer: s.placer, good: s.good, bad: s.bad, pts });
    s.phase = 'reveal';
  }
  commit(s);
}
function actNext(){
  const s = clone(state);
  if (s.round >= s.total) { s.phase = 'over'; commit(s); return; }
  s.round++; s.placer = other(s.placer);
  s.good = s.bad = s.place = s.guess = s.last = null;
  s.phase = 'draw';
  if (mode === 'local') cover = s.placer;
  commit(s);
}
function actRematch(){
  const s = freshState();
  s.p1 = state.p1; s.p2 = state.p2;
  s.phase = 'draw';
  if (mode === 'local') cover = 1;
  commit(s);
}
function actReset(){
  const s = freshState();
  s.phase = 'draw';
  if (mode === 'local') cover = 1;
  commit(s);
}

/* ---------- modes ---------- */
function startLocal(){
  mode = 'local'; state = freshState(); state.phase = 'draw'; cover = 1; render();
}
function shareLink(){ return location.href.split('?')[0].split('#')[0] + '?join=' + room; }

function wireConn(c){
  conn = c;
  c.on('open', () => {
    connected = true; notice = '';
    if (me1 === 1) {               // host owns the starting state and resends it on (re)connect
      if (state.phase === 'lobby') state.phase = 'draw';
      send();
    }
    render();
  });
  c.on('data', msg => {
    if (!msg || msg.type !== 'state' || typeof msg.state !== 'object') return;
    const inc = msg.state;
    if (!state || state.phase !== inc.phase || state.round !== inc.round) pending = null;
    state = inc; loading = false; render();
  });
  c.on('close', () => {
    if (conn !== c) return;
    connected = false;
    notice = me1 === 1 ? 'Player 2 disconnected. They can reopen the invite link to rejoin.' : 'Lost connection to Player 1. Reload the page to rejoin.';
    render();
  });
}

function startHost(){
  if (!window.Peer) { notice = "Couldn't load the connection library — check your internet and reload."; render(); return; }
  mode = 'online'; me1 = 1; room = newCode(); state = freshState(); loading = true; notice = ''; render();
  peer = new Peer(PREFIX + room);
  peer.on('open', () => { loading = false; render(); });
  peer.on('connection', c => {
    if (conn && conn.open) { c.on('open', () => c.close()); return; } // only one Player 2
    wireConn(c);
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { peer.destroy(); startHost(); return; }
    if (e.type === 'network' || e.type === 'server-error') { notice = 'Connection server unreachable. Check your internet and try again.'; render(); }
  });
}

function startJoin(code){
  code = (code || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (!code) { notice = 'Enter the game code from Player 1.'; render(); return; }
  if (!window.Peer) { notice = "Couldn't load the connection library — check your internet and reload."; render(); return; }
  mode = 'online'; me1 = 2; room = code; state = null; loading = true; notice = ''; render();
  peer = new Peer();
  const timer = setTimeout(() => { if (loading) { notice = "Still can't reach Player 1. Check the code, and make sure their game page is still open."; render(); } }, 10000);
  peer.on('open', () => wireConn(peer.connect(PREFIX + code, { reliable: true })));
  peer.on('error', e => {
    clearTimeout(timer);
    if (e.type === 'peer-unavailable') { mode = null; loading = false; notice = `No game found with code "${code}". Check the code, or ask Player 1 to keep their page open.`; render(); }
    else if (e.type === 'network' || e.type === 'server-error') { notice = 'Connection server unreachable. Check your internet and try again.'; render(); }
  });
}

/* ---------- rendering ---------- */
function render(){
  if (!mode) return renderLanding();
  if (mode === 'online' && loading) { app.innerHTML = header() + `<div class="panel">${me1 === 1 ? 'Setting up your game…' : `Connecting to game <b>${esc(room)}</b>…`}</div>`; return; }
  const s = state || freshState();
  if (mode === 'online' && s.phase === 'lobby') return renderLobby();
  renderGame(s);
}

function header(){
  return `<h1>Trait Plot</h1><p class="sub">Draw a good trait and a bad trait. Plot yourself. Your friend guesses where you put the dot.</p>${notice ? `<div class="notice">${esc(notice)}</div>` : ''}`;
}

function renderLanding(){
  let j = ''; try { j = new URLSearchParams(location.search).get('join') || ''; } catch {}
  app.innerHTML = header() + `
    <div class="landing">
      <div class="panel">
        <h2>Player 1</h2>
        <p>Start a game and send the invite link (or code) to your friend.</p>
        <button class="p1" data-act="host">Start a game</button>
      </div>
      <div class="panel">
        <h2>Player 2</h2>
        <p>Enter the code Player 1 sent you, or just open their invite link.</p>
        <div class="row"><input id="roomInput" value="${esc(j)}" placeholder="code" aria-label="Game code"><button class="p2" data-act="join">Join</button></div>
      </div>
      <div class="panel">
        <h2>One device</h2>
        <p>Pass the phone or laptop back and forth. The screen hides each answer before you hand it over.</p>
        <button class="ghost" data-act="local">Play here</button>
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <h2 style="margin:0 0 6px;font-size:17px">How it works</h2>
      <p class="meta" style="margin:0;line-height:1.55">Each round, one player draws a good card and a bad card. They become the two axes of the graph. That player secretly puts a dot where they think they sit (0 = not at all, 10 = extremely). The other player clicks where they think the dot is. Closer guess = more points (100 for a perfect hit, minus 15 per unit of distance). Roles swap every round, for ${TOTAL_ROUNDS} rounds.</p>
    </div>
    <p class="meta" style="margin-top:16px"><a href="./" style="color:var(--muted)">← All games</a></p>`;
}

function renderLobby(){
  app.innerHTML = header() + `
    <div class="panel" style="max-width:520px;display:grid;gap:12px">
      <div class="row" style="justify-content:space-between"><b style="color:var(--p1)">You are Player 1</b><button class="ghost small" data-act="leave">Cancel</button></div>
      <div class="meta">Game code</div>
      <div class="big" style="letter-spacing:4px">${esc(room)}</div>
      <div class="meta">Send your friend this link:</div>
      <div class="row"><input id="shareInput" readonly value="${esc(shareLink())}" style="flex:1;min-width:0"><button class="small" data-act="copy">Copy</button></div>
      <p class="meta" style="margin:0">Waiting for Player 2 to join… Keep this page open.</p>
    </div>`;
}

function renderGame(s){
  const me = myRole(), placer = s.placer, guesser = other(placer);
  const isPlacer = me === placer, isGuesser = me === guesser;
  const name = n => mode === 'local' ? `Player ${n}` : (n === me ? 'You' : `Player ${n}`);

  if (mode === 'local' && cover) {
    const c = cover;
    app.innerHTML = `<div class="cover"><div>
      <h2 style="color:var(--p${c})">Pass to Player ${c}</h2>
      <p>${c === placer ? `Player ${other(c)}, look away. Player ${c} is placing themselves.` : `Player ${other(c)}'s dot is hidden. Time to guess.`}</p>
      <button class="p${c}" data-act="uncover">I'm Player ${c} — show me</button></div></div>`;
    return;
  }

  // what the graph shows
  const pts = [];
  if (s.phase === 'place' && isPlacer && pending) pts.push({ ...pending, color:`var(--p${placer})`, label:'You?' , ghost:true });
  if (s.phase === 'guess' && isPlacer && mode === 'online' && s.place) pts.push({ ...s.place, color:`var(--p${placer})`, label:'You' });
  if (s.phase === 'guess' && isGuesser && pending) pts.push({ ...pending, color:`var(--p${guesser})`, label:'Guess?', ghost:true });
  if (s.phase === 'reveal' && s.place && s.guess) {
    pts.push({ ...s.place, color:`var(--p${placer})`, label:`P${placer} (actual)` });
    pts.push({ ...s.guess, color:`var(--p${guesser})`, label:`P${guesser} (guess)` });
  }
  const clickable = !writeBlocked && ((s.phase === 'place' && isPlacer) || (s.phase === 'guess' && isGuesser));
  const showAxes = s.good && s.bad;

  // status panel
  let status = '';
  const fmt = p => `(${p.x.toFixed(1)}, ${p.y.toFixed(1)})`;
  if (s.phase === 'draw') {
    status = isPlacer
      ? `<div class="status">Your turn to be plotted. Draw one card from each pile.</div><button data-act="draw" ${writeBlocked?'disabled':''}>Draw cards</button>`
      : `<div class="status">Waiting for <b>Player ${placer}</b> to draw cards…</div>`;
  } else if (s.phase === 'place') {
    status = isPlacer
      ? `<div class="status">Click the graph where you think <b>you</b> sit. Player ${guesser} won't see it.</div>
         <div class="meta">${pending ? 'Your dot: ' + fmt(pending) : 'No dot yet'}</div>
         <button data-act="lock" ${pending?'':'disabled'}>Lock in my spot</button>`
      : `<div class="status"><b>Player ${placer}</b> is secretly placing themselves… Start thinking about where they'd put it.</div>`;
  } else if (s.phase === 'guess') {
    status = isGuesser
      ? `<div class="status">Where did <b>Player ${placer}</b> put themselves? Click your guess.</div>
         <div class="meta">${pending ? 'Your guess: ' + fmt(pending) : 'No guess yet'}</div>
         <button class="p${guesser}" data-act="lock" ${pending?'':'disabled'}>Lock in guess</button>`
      : `<div class="status">Your spot is locked at ${s.place ? fmt(s.place) : ''}. Waiting for <b>Player ${guesser}</b> to guess…</div>`;
  } else if (s.phase === 'reveal') {
    status = `<div class="meta">Player ${guesser} was ${s.last.dist} away</div>
      <div class="big" style="color:var(--p${guesser})">+${s.last.pts} pts</div>
      <div class="meta">Actual ${fmt(s.place)} · Guess ${fmt(s.guess)}</div>
      <button data-act="next" ${writeBlocked?'disabled':''}>${s.round >= s.total ? 'See final score' : 'Next round — swap roles'}</button>`;
  } else if (s.phase === 'over') {
    const a = s.scores["1"] || 0, b = s.scores["2"] || 0;
    const win = a === b ? "It's a tie!" : `Player ${a > b ? 1 : 2} wins!`;
    status = `<div class="big">${win}</div><div class="meta">${a} – ${b}</div><button data-act="rematch" ${writeBlocked?'disabled':''}>Play again</button>`;
  }

  const card = (kind, trait) => `<div class="pile ${kind}"><div class="lbl">${kind === 'good' ? 'Good trait' : 'Bad trait'} · ${kind === 'good' ? 'X axis' : 'Y axis'}</div>
     ${trait ? `<div class="trait">${esc(trait)}</div>` : `<div class="back">Face down</div>`}</div>`;

  const hist = s.history.length ? `<div class="panel" style="padding:14px"><b style="font-size:14px">Rounds</b><table class="hist">${
    s.history.map(h => `<tr><td>R${h.round} · P${h.placer} plotted · ${esc(h.good)} / ${esc(h.bad)}</td><td>+${h.pts}</td></tr>`).join('')}</table></div>` : '';

  const chip = n => `<span class="chip p${n} ${me===n?'me':''}">${mode==='online' && me===n ? 'You (P'+n+')' : 'P'+n}: ${s.scores[n] || 0}</span>`;

  app.innerHTML = header() + `
    <div class="top">
      <div class="score">${chip(1)}${chip(2)}</div>
      <div class="row"><span class="meta">${s.phase === 'over' ? 'Game over' : `Round ${s.round} of ${s.total}`}${mode==='online' ? ` · room ${esc(room)}` : ''}</span>
        <button class="ghost small" data-act="reset">Restart</button><button class="ghost small" data-act="leave">Leave</button></div>
    </div>
    <div class="game">
      <div class="plotBox">${plotSVG(showAxes ? s.good : null, showAxes ? s.bad : null, pts, clickable, s.phase === 'reveal')}</div>
      <div class="side">
        <div class="piles">${card('good', s.good)}${card('bad', s.bad)}</div>
        <div class="panel" style="display:grid;gap:12px">${status}</div>
        ${hist}
      </div>
    </div>`;
}

/* plot geometry */
const PX0 = 60, PY0 = 20, PW = 400, PH = 400;
const toSX = v => PX0 + v / 10 * PW, toSY = v => PY0 + PH - v / 10 * PH;

function plotSVG(good, bad, pts, clickable, line){
  let g = '';
  for (let i = 0; i <= 10; i++) {
    const x = toSX(i), y = toSY(i), major = i % 5 === 0;
    g += `<line x1="${x}" y1="${PY0}" x2="${x}" y2="${PY0+PH}" stroke="${major?'#cfc6b4':'#ebe4d6'}" stroke-width="${major?1.5:1}"/>`;
    g += `<line x1="${PX0}" y1="${y}" x2="${PX0+PW}" y2="${y}" stroke="${major?'#cfc6b4':'#ebe4d6'}" stroke-width="${major?1.5:1}"/>`;
    if (major) {
      g += `<text x="${x}" y="${PY0+PH+18}" font-size="12" text-anchor="middle" fill="#8a8478">${i}</text>`;
      g += `<text x="${PX0-10}" y="${y+4}" font-size="12" text-anchor="end" fill="#8a8478">${i}</text>`;
    }
  }
  const xl = good ? `<tspan font-weight="700" fill="var(--good)">${esc(good)}</tspan> →` : 'Good trait →';
  const yl = bad ? `<tspan font-weight="700" fill="var(--bad)">${esc(bad)}</tspan> →` : 'Bad trait →';
  g += `<text x="${PX0+PW/2}" y="${PY0+PH+42}" font-size="16" text-anchor="middle" fill="#1f1d1a">${xl}</text>`;
  g += `<text transform="translate(20 ${PY0+PH/2}) rotate(-90)" font-size="16" text-anchor="middle" fill="#1f1d1a">${yl}</text>`;
  if (line && pts.length === 2) {
    g += `<line x1="${toSX(pts[0].x)}" y1="${toSY(pts[0].y)}" x2="${toSX(pts[1].x)}" y2="${toSY(pts[1].y)}" stroke="#1f1d1a" stroke-width="2" stroke-dasharray="5 5"/>`;
  }
  for (const p of pts) {
    const x = toSX(p.x), y = toSY(p.y);
    const anchor = p.x > 7 ? 'end' : 'start', dx = p.x > 7 ? -14 : 14;
    g += `<circle cx="${x}" cy="${y}" r="11" fill="${p.color}" fill-opacity="${p.ghost?0.55:1}" stroke="#fff" stroke-width="3"/>`;
    g += `<text x="${x+dx}" y="${y-12}" font-size="13" font-weight="700" text-anchor="${anchor}" fill="${p.color}">${esc(p.label)}</text>`;
  }
  return `<svg id="plot" class="${clickable?'clickable':''}" viewBox="0 0 ${PX0+PW+20} ${PY0+PH+56}" role="img" aria-label="Trait graph">
    <rect x="${PX0}" y="${PY0}" width="${PW}" height="${PH}" fill="#fffdf8"/>${g}</svg>`;
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const svg = e.target.closest('svg#plot');
  if (svg && svg.classList.contains('clickable')) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const clamp = v => Math.max(0, Math.min(10, Math.round(v * 10) / 10));
    pending = { x: clamp((p.x - PX0) / PW * 10), y: clamp((PY0 + PH - p.y) / PH * 10) };
    render(); return;
  }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'host') startHost();
  else if (a === 'join') startJoin(document.getElementById('roomInput')?.value);
  else if (a === 'local') { notice = ''; startLocal(); }
  else if (a === 'copy') {
    const inp = document.getElementById('shareInput');
    const done = () => { el.textContent = 'Copied!'; };
    try { navigator.clipboard.writeText(inp.value).then(done, () => { inp.select(); document.execCommand('copy'); done(); }); }
    catch { inp.select(); try { document.execCommand('copy'); done(); } catch {} }
  }
  else if (a === 'draw') actDraw();
  else if (a === 'lock') actLock();
  else if (a === 'next') actNext();
  else if (a === 'rematch') actRematch();
  else if (a === 'reset') { if (el.dataset.sure) actReset(); else { el.dataset.sure = '1'; el.textContent = 'Sure? Click again'; } }
  else if (a === 'uncover') { cover = 0; render(); }
  else if (a === 'leave') {
    try { if (conn) conn.close(); if (peer) peer.destroy(); } catch {}
    conn = peer = null; connected = false; me1 = 0;
    mode = null; state = null; pending = null; notice = ''; render();
  }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'roomInput') startJoin(e.target.value); });

(() => {  // invite link opens straight into the game
  let j = ''; try { j = new URLSearchParams(location.search).get('join') || ''; } catch {}
  if (j) { const go = () => startJoin(j); if (window.Peer) go(); else window.addEventListener('load', go); }
  else render();
})();
</script>
</body>
</html>
